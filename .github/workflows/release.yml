name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git archive --prefix=mpv-anilist-updater/ -o mpv-anilist-updater.zip "$GITHUB_REF_NAME"
      - run: |
          if git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" >/dev/null 2>&1; then
            notes=(--generate-notes)
          else
            notes=(--notes "")
          fi
          gh release create "$GITHUB_REF_NAME" mpv-anilist-updater.zip "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
