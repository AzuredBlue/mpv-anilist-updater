line-length = 115

[format]
skip-magic-trailing-comma = false

[lint]
select = ["ALL"]
preview = true
ignore = [
  "blind-except",
  "complex-structure",
  "missing-trailing-comma",
  "missing-copyright-notice",
  "multi-line-summary-first-line",
  "docstring-missing-returns",
  "line-too-long",
  "raw-string-in-exception",
  "f-string-in-exception",
  "future-rewritable-type-annotation",
  "boolean-type-hint-positional-argument",
  "read-whole-file",
  "write-whole-file",
  "implicit-namespace-package",
  "blanket-type-ignore",
  "too-many-branches",
  "too-many-locals",
  "too-many-statements",
  "magic-value-comparison",
  "no-self-use",
  "os-path-exists",
  "os-path-join",
  "os-path-dirname",
  "os-path-splitext",
  "builtin-open",
  "unnecessary-assign",
  "assert",
  "print",
  "raise-vanilla-class",
  "raise-vanilla-args",
  "try-consider-else",
]
fixable = ["ALL"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/*" = ["D", "ANN", "assert", "magic-value-comparison", "no-self-use", "import-private-name", "too-many-arguments", "unused-method-argument"]
"anilist_updater/errors.py" = ["error-suffix-on-exception-name"]
